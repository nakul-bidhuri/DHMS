    <path d="M12 20H32" stroke="#E53935" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M14 29H30" stroke="#E53935" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
